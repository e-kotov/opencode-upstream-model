name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check version matches tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: test "v$(node -p 'require("./package.json").version')" = "$RELEASE_TAG"
      - name: Install OpenCode 2.1.4
        env:
          OPENCODE_ARCHIVE_SHA256: 2edaf8cf96e81dec5ee996a3196b03345cf59e5a1673d83a4599bb4afc5c5f6d
        run: |
          curl --fail --location --retry 3 https://opencode.ai/files/bin/2.1.4/opencode-linux-x64-baseline.tar.gz --output "$RUNNER_TEMP/opencode.tar.gz"
          echo "$OPENCODE_ARCHIVE_SHA256  $RUNNER_TEMP/opencode.tar.gz" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/opencode-bin"
          tar -xzf "$RUNNER_TEMP/opencode.tar.gz" -C "$RUNNER_TEMP/opencode-bin"
          "$RUNNER_TEMP/opencode-bin/opencode" --version
          echo "$RUNNER_TEMP/opencode-bin" >> "$GITHUB_PATH"
      - name: Check installer syntax
        run: bash -n install.sh
      - name: Run tests
        run: npm test
      - name: Extract release notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - "$RELEASE_TAG" CHANGELOG.md "$RUNNER_TEMP/release-notes.md" <<'PY'
          from pathlib import Path
          import sys
          tag, changelog, output = sys.argv[1:]
          lines = Path(changelog).read_text().splitlines()
          heading = f"## {tag}"
          start = next((i for i, line in enumerate(lines) if line == heading), None)
          if start is None:
              raise SystemExit(f"No {heading} section found in {changelog}")
          end = next((i for i in range(start + 1, len(lines)) if lines[i].startswith("## ")), len(lines))
          notes = "\n".join(lines[start:end]).strip() + "\n"
          if len(notes.strip()) == len(heading):
              raise SystemExit(f"{heading} section is empty")
          Path(output).write_text(notes)
          PY
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --title "OpenCode Upstream Model $GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/release-notes.md"
